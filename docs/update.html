<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Update Debrief</title>
<style>html{min-height:100%;background:#141d18}body{background:linear-gradient(#e3dfc5f2,#e3dfc5f2),url('./assets/notebook-paper.webp') center/100% 100%;color:#233021;font:18px Georgia,serif;max-width:30em;margin:10vh auto;padding:32px;line-height:1.6;border-left:7px solid #53613f;border-bottom:3px double #7e8564;box-shadow:3px 4px #080e0a}h1{font-style:italic;font-weight:400}button{background:#2b3927;color:#e2dcc0;border:1px solid #869072;border-bottom:3px double #869072;padding:16px;font:13px 'Courier New',monospace;cursor:pointer;min-height:44px}button:focus-visible,a:focus-visible{outline:2px dashed #844e38;outline-offset:4px}button:disabled{opacity:.5;cursor:default}a{color:#35432c;text-underline-offset:5px}@media(max-width:600px){body{margin:24px 14px;padding:24px;font-size:16px}}</style>
<h1>Update Debrief</h1>
<p id="status" role="status">Your saved shift stays on this device.</p>
<button id="update">Load latest game</button>
<p><a href="./">Return to the game</a></p>
<script>
const button = document.getElementById('update');
const status = document.getElementById('status');
button.onclick = async () => {
  button.disabled = true;
  status.textContent = 'Downloading the latest game…';
  try {
    const reg = await navigator.serviceWorker.register('./sw.js', { updateViaCache: 'none' });
    await reg.update();
    if (reg.installing) {
      const worker = reg.installing;
      await new Promise((resolve, reject) => {
        const check = () => {
          if (worker.state === 'installed' || worker.state === 'activated') resolve();
          else if (worker.state === 'redundant') reject(new Error('Installation failed'));
        };
        worker.addEventListener('statechange', check);
        check();
      });
    }
    if (reg.waiting) {
      navigator.serviceWorker.addEventListener('controllerchange', () => location.replace('./'), { once: true });
      reg.waiting.postMessage({ type: 'SKIP_WAITING' });
    } else location.replace('./');
  } catch {
    status.textContent = 'The update could not download. Check your connection and try again.';
    button.disabled = false;
  }
};
</script>
</html>
